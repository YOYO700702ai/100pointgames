<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理員後台｜亞德雷大陸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  /* 登入畫面 */
  #loginScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 16px;
  }
  #loginScreen h1 { font-size: 1.5rem; color: #94a3b8; letter-spacing: 0.1em; }
  #loginScreen input {
    padding: 12px 20px; border-radius: 10px; border: 2px solid #334155;
    background: #1e293b; color: #e2e8f0; font-size: 1.1rem; width: 260px;
    text-align: center; outline: none;
  }
  #loginScreen input:focus { border-color: #6366f1; }
  #loginScreen button {
    padding: 10px 32px; background: #6366f1; color: white; border: none;
    border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
  }
  #loginScreen button:hover { background: #4f46e5; }
  #loginError { color: #f87171; font-size: 0.9rem; }

  /* 主頁面 */
  #mainScreen { display: none; padding: 24px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .header h1 { font-size: 1.4rem; font-weight: bold; color: #a5b4fc; }
  .header span { font-size: 0.85rem; color: #64748b; }

  /* 統計列 */
  .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-card {
    background: #1e293b; border-radius: 12px; padding: 16px 24px;
    border: 1px solid #334155; flex: 1; min-width: 140px;
  }
  .stat-card .label { font-size: 0.75rem; color: #64748b; margin-bottom: 4px; }
  .stat-card .value { font-size: 1.6rem; font-weight: bold; color: #e2e8f0; }

  /* 工具列 */
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .toolbar input {
    padding: 8px 14px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0; font-size: 0.9rem; flex: 1; min-width: 180px;
  }
  .btn { padding: 8px 18px; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.8; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-refresh { background: #0ea5e9; color: white; }
  .btn-logout { background: #334155; color: #94a3b8; }

  /* 表格 */
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #334155; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead { background: #1e293b; }
  thead th { padding: 12px 14px; text-align: left; color: #94a3b8; font-weight: 600; white-space: nowrap; }
  tbody tr { border-top: 1px solid #1e293b; transition: background 0.1s; }
  tbody tr:hover { background: #1e293b; }
  tbody td { padding: 10px 14px; vertical-align: middle; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 99px;
    font-size: 0.75rem; font-weight: bold;
  }
  .badge-lv { background: #312e81; color: #a5b4fc; }
  .badge-gold { background: #422006; color: #fbbf24; }
  .badge-hp { background: #450a0a; color: #fca5a5; }
  .zone-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; }
  .dot-on { background: #22c55e; }
  .dot-off { background: #374151; }
  .del-btn {
    padding: 4px 12px; background: #7f1d1d; color: #fca5a5;
    border: 1px solid #991b1b; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
  }
  .del-btn:hover { background: #991b1b; }
  .select-cb { width: 16px; height: 16px; cursor: pointer; accent-color: #6366f1; }

  .empty { text-align: center; padding: 40px; color: #475569; }
  .loading { text-align: center; padding: 40px; color: #64748b; }
  #deleteCount { color: #f87171; font-size: 0.85rem; }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="loginScreen">
  <h1>🏰 亞德雷大陸・管理後台</h1>
  <input type="password" id="pwInput" placeholder="輸入管理員密碼" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">進入</button>
  <span id="loginError"></span>
</div>

<!-- 主頁面 -->
<div id="mainScreen">
  <div class="header">
    <h1>🏰 亞德雷大陸・管理後台</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="lastRefresh"></span>
      <button class="btn btn-refresh" onclick="loadData()">🔄 重新整理</button>
      <button class="btn btn-logout" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- 統計 -->
  <div class="stats">
    <div class="stat-card"><div class="label">總玩家數</div><div class="value" id="statTotal">-</div></div>
    <div class="stat-card"><div class="label">最高等級</div><div class="value" id="statMaxLv">-</div></div>
    <div class="stat-card"><div class="label">拿到鑰匙</div><div class="value" id="statKey">-</div></div>
    <div class="stat-card"><div class="label">看過結局</div><div class="value" id="statClear">-</div></div>
  </div>

  <!-- 工具列 -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 搜尋帳號或暱稱..." oninput="renderTable()">
    <span id="deleteCount"></span>
    <button class="btn btn-danger" onclick="deleteSelected()" id="delBtn" style="display:none">🗑️ 刪除勾選</button>
  </div>

  <!-- 表格 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" class="select-cb" id="selectAll" onchange="toggleAll(this)"></th>
          <th>帳號 ID</th>
          <th>暱稱</th>
          <th>等級</th>
          <th>HP</th>
          <th>金幣</th>
          <th>ATK</th>
          <th>通關區域</th>
          <th>鑰匙</th>
          <th>成就</th>
          <th>通關</th>
          <th>最後遊戲時間</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"><tr><td colspan="13" class="loading">載入中...</td></tr></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getFirestore, collection, getDocs, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const ADMIN_PASSWORD = 'yoyo2026';  // ← 在這裡改你的密碼

  const firebaseConfig = {
    apiKey: "AIzaSyBnHKkNtvQdSoCywSCZKkwPI_dRLJNXvXg",
    authDomain: "rpggame-7ae09.firebaseapp.com",
    projectId: "rpggame-7ae09",
    storageBucket: "rpggame-7ae09.firebasestorage.app",
    messagingSenderId: "766489842525",
    appId: "1:766489842525:web:75a6ca54772ee659854eb4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let allPlayers = [];

  // Firestore records are untrusted display data; only the SDK document ID may
  // identify a delete target. Normalize before statistics, search or rendering.
  const recordObject = value => value && typeof value === 'object' && !Array.isArray(value) ? value : {};
  const displayText = (value, fallback = '') => {
    if (typeof value === 'string') return value;
    if (typeof value === 'number' && Number.isFinite(value)) return String(value);
    return fallback;
  };
  const finiteNumber = (value, fallback = 0) => {
    if (typeof value !== 'number' && !(typeof value === 'string' && value.trim())) return fallback;
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  };
  function normalizePlayer(documentId, value) {
    const data = recordObject(value);
    const zoneData = recordObject(data.zoneClears);
    const player = {
      _id: displayText(documentId),
      accountId: displayText(data.accountId),
      name: displayText(data.name),
      level: Math.max(1, finiteNumber(data.level, 1)),
      hp: finiteNumber(data.hp),
      baseMaxHp: finiteNumber(data.baseMaxHp, 15),
      gold: finiteNumber(data.gold),
      baseAtk: finiteNumber(data.baseAtk, 8),
      inventory: Array.isArray(data.inventory) ? data.inventory
        .filter(item => item && typeof item === 'object' && !Array.isArray(item))
        .map(item => ({ id: displayText(item.id) })) : [],
      equipped: { pet: displayText(recordObject(data.equipped).pet) },
      zoneClears: Object.fromEntries(['east_forest', 'west_desert', 'south_harbor', 'north_tundra', 'outer_ruins']
        .map(id => [id, finiteNumber(zoneData[id])])),
      examZeroClears: finiteNumber(data.examZeroClears),
      gachaSpent: finiteNumber(data.gachaSpent),
      totalGoldEarned: finiteNumber(data.totalGoldEarned),
      achNoWrong: data.achNoWrong === true,
      cardGodWon: data.cardGodWon === true,
      gameCleared: data.gameCleared === true,
      savedAt: null,
    };
    if (typeof data.savedAt === 'string' || (typeof data.savedAt === 'number' && Number.isFinite(data.savedAt))) {
      const timestamp = new Date(data.savedAt).getTime();
      if (Number.isFinite(timestamp)) player.savedAt = timestamp;
    }
    return player;
  }
  function tableStatus(message, className) {
    const row = document.createElement('tr');
    const cell = document.createElement('td');
    cell.colSpan = 13;
    cell.className = className;
    cell.textContent = message;
    row.append(cell);
    document.getElementById('tableBody').replaceChildren(row);
  }

  // 登入
  window.login = () => {
    const pw = document.getElementById('pwInput').value;
    if (pw === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'block';
      loadData();
    } else {
      document.getElementById('loginError').textContent = '密碼錯誤';
      document.getElementById('pwInput').value = '';
    }
  };

  window.logout = () => {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('pwInput').value = '';
    allPlayers = [];
  };

  // 載入資料
  window.loadData = async () => {
    tableStatus('載入中...', 'loading');
    try {
      const snap = await getDocs(collection(db, 'saves'));
      allPlayers = snap.docs.map(d => normalizePlayer(d.id, d.data()));
      updateStats();
      renderTable();
      document.getElementById('lastRefresh').textContent = '更新：' + new Date().toLocaleTimeString('zh-TW');
    } catch(e) {
      tableStatus('讀取失敗：' + displayText(e?.message, '無法讀取資料'), 'empty');
    }
  };

  // 統計
  function updateStats() {
    document.getElementById('statTotal').textContent = allPlayers.length;
    const maxLv = allPlayers.reduce((m, p) => Math.max(m, p.level || 1), 1);
    document.getElementById('statMaxLv').textContent = 'LV.' + maxLv;
    const keyCount = allPlayers.filter(p => (p.inventory||[]).some(i => i.id === 'key_strange')).length;
    document.getElementById('statKey').textContent = keyCount + ' 人';
    const clearCount = allPlayers.filter(p => p.gameCleared === true).length;
    document.getElementById('statClear').textContent = clearCount + ' 人';
  }

  // 渲染表格
  window.renderTable = () => {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allPlayers.filter(p =>
      (p.accountId || '').toLowerCase().includes(q) ||
      (p.name || '').toLowerCase().includes(q)
    );
    const zones = [
      { id: 'east_forest', label: '國' },
      { id: 'west_desert', label: '數' },
      { id: 'south_harbor', label: '自' },
      { id: 'north_tundra', label: '英' },
      { id: 'outer_ruins', label: '社' },
    ];
    if (filtered.length === 0) {
      tableStatus('沒有資料', 'empty');
      return;
    }
    const tableBody = document.getElementById('tableBody');
    tableBody.replaceChildren();
    const number = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
    filtered.forEach(p => {
      const zoneClears = p.zoneClears || {};
      const inventory = Array.isArray(p.inventory) ? p.inventory : [];
      const hasKey = inventory.some(i => i?.id === 'key_strange');
      const level = number(p.level, 1);
      const atk = number(p.baseAtk, 8) + (level - 1) * 2;
      const TOTAL_ACH = 12;
      const achCount = [
        (p.examZeroClears||0)>=5,
        p.achNoWrong===true,
        p.level>=10,
        (p.gachaSpent||0)>=5000,
        (p.totalGoldEarned||0)>=10000,
        ((p.zoneClears||{}).west_desert||0)>=5,
        ((p.zoneClears||{}).north_tundra||0)>=5,
        ((p.zoneClears||{}).south_harbor||0)>=5,
        ((p.zoneClears||{}).outer_ruins||0)>=5,
        ((p.zoneClears||{}).east_forest||0)>=5,
        p.cardGodWon===true,
        ['pet_owl','pet_jellyfish','pet_ankylo','pet_rat','pet_stompy'].every(id=>inventory.some(i=>i?.id===id)||p.equipped?.pet===id),
      ].filter(Boolean).length;
      const row = document.createElement('tr');
      const cell = (value = '') => {
        const td = document.createElement('td');
        td.textContent = String(value);
        row.append(td);
        return td;
      };
      const badge = (value, className) => {
        const span = document.createElement('span');
        span.className = `badge ${className}`;
        span.textContent = value;
        cell().append(span);
      };
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'select-cb row-cb';
      checkbox.dataset.id = String(p._id);
      cell().append(checkbox);
      cell(p.accountId || '-').style.cssText = 'font-family:monospace;color:#94a3b8';
      cell(p.name || '-').style.fontWeight = 'bold';
      badge(`LV.${level}`, 'badge-lv');
      badge(`${number(p.hp)}/${number(p.baseMaxHp, 15) + (level - 1) * 10}`, 'badge-hp');
      badge(`💰${number(p.gold)}`, 'badge-gold');
      cell(`⚔️${atk}`);
      const zoneCell = cell();
      zoneCell.style.fontSize = '0.8rem';
      zones.forEach(z => {
        const count = number(zoneClears[z.id]);
        const dot = document.createElement('span');
        dot.className = `zone-dot ${count > 0 ? 'dot-on' : 'dot-off'}`;
        dot.title = `${z.label} ${count}次`;
        zoneCell.append(dot, document.createTextNode(`${z.label} `));
      });
      cell(hasKey ? '🗝️' : '—');
      cell(`${achCount}/${TOTAL_ACH}`);
      cell(p.gameCleared ? '✅' : '—');
      cell(p.savedAt ? new Date(p.savedAt).toLocaleString('zh-TW', {timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—').style.cssText = 'font-size:0.78rem;color:#94a3b8;white-space:nowrap';
      const deleteButton = document.createElement('button');
      deleteButton.className = 'del-btn';
      deleteButton.textContent = '刪除';
      deleteButton.addEventListener('click', () => window.deleteSingle(String(p._id), String(p.name || p.accountId || '')));
      cell().append(deleteButton);
      tableBody.append(row);
    });

    document.querySelectorAll('.row-cb').forEach(cb => {
      cb.addEventListener('change', updateDelBtn);
    });
  };

  function updateDelBtn() {
    const checked = document.querySelectorAll('.row-cb:checked').length;
    document.getElementById('delBtn').style.display = checked > 0 ? 'inline-block' : 'none';
    document.getElementById('deleteCount').textContent = checked > 0 ? `已選 ${checked} 筆` : '';
  }

  window.toggleAll = (cb) => {
    document.querySelectorAll('.row-cb').forEach(r => r.checked = cb.checked);
    updateDelBtn();
  };

  // 刪除單筆
  window.deleteSingle = async (id, name) => {
    if (!confirm(`確定要刪除「${name}」的存檔嗎？`)) return;
    await deleteDoc(doc(db, 'saves', id));
    allPlayers = allPlayers.filter(p => p._id !== id);
    updateStats();
    renderTable();
  };

  // 刪除勾選
  window.deleteSelected = async () => {
    const checked = [...document.querySelectorAll('.row-cb:checked')].map(cb => cb.dataset.id);
    if (checked.length === 0) return;
    if (!confirm(`確定要刪除 ${checked.length} 筆存檔嗎？此操作無法還原。`)) return;
    for (const id of checked) {
      await deleteDoc(doc(db, 'saves', id));
    }
    allPlayers = allPlayers.filter(p => !checked.includes(p._id));
    updateStats();
    renderTable();
    document.getElementById('delBtn').style.display = 'none';
    document.getElementById('deleteCount').textContent = '';
    document.getElementById('selectAll').checked = false;
  };
</script>
</body>
</html>
