<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#193E35">
  <meta name="description" content="踏上亞德雷大陸，探索村莊、解答挑戰，與夥伴一起展開知識冒險。">
  <title>亞德雷大陸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/game.css?v=__CSS_HASH__">
  <script type="importmap">
    {"imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js"
    }}
  </script>
</head>
<body class="m-0 p-0 overflow-hidden">
  <div id="root">
    <div class="game-boot" role="status" aria-live="polite">
      <h1>亞德雷大陸</h1>
      <p id="boot-message">正在準備你的冒險……</p>
      <button id="boot-retry" type="button" hidden>重新載入</button>
    </div>
  </div>
  <noscript>請啟用 JavaScript，才能開始亞德雷大陸的冒險。</noscript>
  <script type="module">
    import('./assets/game.js?v=__JS_HASH__').catch((error) => {
      console.error('遊戲載入失敗', error);
      const message = document.getElementById('boot-message');
      const retry = document.getElementById('boot-retry');
      if (message) message.textContent = '遊戲暫時無法載入，請確認網路後再試一次。';
      if (retry) {
        retry.hidden = false;
        retry.addEventListener('click', () => window.location.reload(), { once: true });
      }
    });
  </script>
</body>
</html>
