name: Publish game files only
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Package only public game assets
        run: node scripts/package-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
